[project]
name = "swccg-policy"
version = "0.1.0"
description = "Card-embedding encoder and option-scoring policy for Star Wars CCG, trained on Gemp games"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "numpy>=2.0",
    "orjson>=3.10",
    "sentence-transformers>=3.0",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "onnxscript>=0.7.2",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[project.scripts]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swccg_policy"]
